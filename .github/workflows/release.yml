# Publishes to the PowerShell Gallery when a tag vX.Y.Z equal to ModuleVersion is pushed
# (secret PSGALLERY_API_KEY: API key of the powershellgallery.com account, scoped to WsCreator)
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version, then publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $version = (Import-PowerShellDataFile src/WsCreator/WsCreator.psd1).ModuleVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME != ModuleVersion $version" }
          Publish-PSResource -Path src/WsCreator -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
