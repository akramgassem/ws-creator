# Documentation site (docs/, Astro Starlight): built on every PR that touches it, published to
# GitHub Pages from main only. Windows runner: the command reference is generated by importing
# the module (Get-Help), which requires Windows.
name: pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/WsCreator/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'src/WsCreator/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site's address
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # last updated dates come from git history
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: Command reference from Get-Help
        shell: pwsh
        run: ./docs/scripts/New-CommandReference.ps1
      - name: Build (fails on broken internal links)
        working-directory: docs
        env:
          # where the site is published, read by astro.config.mjs (content settings: site.json)
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
