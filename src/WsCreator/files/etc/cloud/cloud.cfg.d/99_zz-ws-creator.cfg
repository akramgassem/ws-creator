# Réglages de cloud-init valables à chaque passage, quels que soient les fragments joués
# (apply -Only guard n'a pas le fragment base). Dans cloud.cfg.d, le dernier fichier par ordre
# alphabétique gagne : ce nom passe après 99_wsl.cfg d'Ubuntu.

# seed NoCloud seulement (/var/lib/cloud/seed/nocloud) : 99_wsl.cfg essaie d'abord la source
# WSL (%USERPROFILE%\.cloud-init par /mnt/c)
datasource_list: [NoCloud, None]

# le nom vient de wsl.conf (appliqué au lancement suivant) : changé à chaud par cloud-init,
# il manquerait dans /etc/hosts que WSL génère, et sudo ne résoudrait plus l'hôte
preserve_hostname: true

# cloud-init supprime et régénère les clés d'hôte SSH à chaque nouvelle instance, donc à
# chaque rejeu (clean) : ssh et VS Code refuseraient l'hôte. On garde celles qui existent.
ssh_deletekeys: false
