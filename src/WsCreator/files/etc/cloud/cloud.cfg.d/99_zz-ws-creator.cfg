# cloud-init settings that hold on every run, whatever fragments are applied
# (apply -Only guard has no base fragment). In cloud.cfg.d, the last file in alphabetical
# order wins: this name sorts after Ubuntu's 99_wsl.cfg.

# NoCloud seed only (/var/lib/cloud/seed/nocloud): 99_wsl.cfg first tries the WSL source
# (%USERPROFILE%\.cloud-init through /mnt/c)
datasource_list: [NoCloud, None]

# the name comes from wsl.conf (applied at the next launch): changed live by cloud-init, it
# would be missing from the /etc/hosts WSL generates, and sudo could no longer resolve the host
preserve_hostname: true

# cloud-init deletes and regenerates SSH host keys on every new instance, so on every rerun
# (clean): ssh and VS Code would reject the host. Existing keys are kept.
ssh_deletekeys: false
