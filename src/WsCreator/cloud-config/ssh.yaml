#cloud-config
# ssh fragment: sshd on loopback only. It is reached through wsl.exe + nc (ProxyCommand of the
# alias ws-creator writes on the Windows side), never over the network: with WSL mirrored,
# 0.0.0.0 would expose the port on the LAN. What each machine decides is in
# machines/<name>/user-data.yaml: port and user (sshd_config.d/60-ws-creator-machine.conf),
# authorized key (ssh_authorized_keys of users).
merge_how: 'dict(recurse_array,no_replace)+list(append)'

packages: [openssh-server, netcat-openbsd]

write_files:
  - path: /etc/ssh/sshd_config.d/50-ws-creator.conf
    content: |
      ListenAddress 127.0.0.1
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no

runcmd:
  - |
    set -e
    mkdir -p /run/sshd
    sshd -t
    # Ubuntu 24.04 starts sshd through a socket on port 22: switch to the classic service
    systemctl disable --now ssh.socket || true
    systemctl enable ssh.service
    systemctl restart ssh.service
