#cloud-config
# mise fragment: mise and the tools in its config for the machine's user (uid 1000).
# The config (~/.config/mise/config.toml) is written by machines/<name>/user-data.yaml.
# runcmd runs again on every cloud-init rerun: each command checks before acting.
merge_how: 'dict(recurse_array,no_replace)+list(append)'

runcmd:
  - |
    set -e
    u=$(getent passwd 1000 | cut -d: -f1)
    home=$(getent passwd 1000 | cut -d: -f6)
    # write_files creates parent folders as root
    chown -R "$u:$u" "$home/.config"
    # mise binary (official installer, in the user's ~/.local/bin)
    [ -x "$home/.local/bin/mise" ] || sudo -u "$u" -H bash -c 'curl -fsSL https://mise.run | sh'
    # activation in interactive shells, only once
    line='eval "$(~/.local/bin/mise activate bash)"'
    grep -qxF "$line" "$home/.bashrc" || echo "$line" >> "$home/.bashrc"
    # shims for non-interactive commands (ssh 'cmd'): at the top of .bashrc, before Ubuntu's
    # "return" that stops non-interactive shells
    shims='export PATH="$HOME/.local/share/mise/shims:$PATH"'
    grep -qxF "$shims" "$home/.bashrc" || sed -i "1i $shims" "$home/.bashrc"
    sudo -u "$u" -H env MISE_YES=1 "$home/.local/bin/mise" install
