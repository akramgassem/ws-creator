#cloud-config
# base fragment, shared by all machines: nothing that depends on one of them. What is specific
# to a machine (user, permissions, wsl.conf, packages) is in machines/<name>/user-data.yaml.
merge_how: 'dict(recurse_array,no_replace)+list(append)'
# What must hold on every run, even without this fragment (apply -Only), is in the system
# config: files/etc/cloud/cloud.cfg.d/99_zz-ws-creator.cfg (sources, hostname, SSH keys).

package_update: true
packages: [sudo, curl, git, ca-certificates]

write_files:
  # Falcon prevents the user's systemd session: without this setting, the resulting error is
  # broadcast to every terminal at each login.
  - path: /etc/systemd/journald.conf.d/50-ws-creator.conf
    content: |
      [Journal]
      ForwardToWall=no

runcmd:
  - systemctl restart systemd-journald   # rereads 50-ws-creator.conf
  # Falcon prevents the user's systemd session: systemd is not asked to start it at boot
  # (linger), it would fail. The machine's user is uid 1000.
  - |
    loginctl disable-linger "$(getent passwd 1000 | cut -d: -f1)"
