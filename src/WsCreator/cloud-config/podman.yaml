#cloud-config
# Fragment podman : podman en root (Falcon empêche la session systemd de l'utilisateur, dont le
# mode rootless a besoin) ; l'utilisateur le pilote par le socket de l'API, ouvert au groupe
# podman. Ce que chaque machine décide est dans machines/<nom>/user-data.yaml : appartenance au
# groupe podman (accès au socket = droits root) et sous-réseau (containers.conf.d/60-ws-creator-machine.conf).
merge_how: 'dict(recurse_array,no_replace)+list(append)'

# groupe système, avant la création de l'utilisateur (bootcmd précède users_groups) : avec la clé
# groups, cloud-init le créerait en gid 1000 et l'utilisateur prendrait le gid 1001
bootcmd:
  - [sh, -c, 'getent group podman >/dev/null || groupadd --system podman']

# podman-docker : commande docker redirigée vers podman + lien /run/docker.sock
packages: [podman, podman-docker]

write_files:
  # sans ce fichier, docker (podman-docker) affiche un avertissement à chaque appel
  - path: /etc/containers/nodocker
    content: ""
  # noms d'images courts
  - path: /etc/containers/registries.conf.d/50-ws-creator.conf
    content: |
      unqualified-search-registries = ["docker.io"]
  # Falcon ne délègue aucun contrôleur cgroup sous sensor.falcon : la limite de pids par défaut
  # (2048) exige le contrôleur pids, on la retire. --memory/--cpus échoueront.
  - path: /etc/containers/containers.conf.d/50-ws-creator.conf
    content: |
      [containers]
      pids_limit = 0
  - path: /etc/systemd/system/podman.socket.d/50-ws-creator.conf
    content: |
      [Socket]
      SocketGroup=podman
      SocketMode=0660
  # WSL fixe XDG_RUNTIME_DIR même quand la session utilisateur échoue (Falcon)
  - path: /etc/profile.d/ws-creator-podman.sh
    content: |
      [ -d "${XDG_RUNTIME_DIR:-}" ] || unset XDG_RUNTIME_DIR

runcmd:
  - |
    set -e
    # le paquet crée /run/podman en 700 root (tmpfiles) : on l'ouvre aussi au groupe
    sed 's|^D! /run/podman 0700 root root|D! /run/podman 0750 root podman|' \
        /usr/lib/tmpfiles.d/podman.conf > /etc/tmpfiles.d/podman.conf
    mkdir -p /run/podman
    chgrp podman /run/podman
    chmod 0750 /run/podman
    systemctl daemon-reload
    systemctl enable podman.socket
    systemctl restart podman.socket
    # la commande podman de l'utilisateur passe par ce socket, dans toute session :
    # /etc/environment est lu par PAM (ssh, VS Code), même sans shell de connexion ; même socket
    # pour les outils qui parlent « Docker » (compose, Testcontainers…)
    grep -q '^CONTAINER_HOST=' /etc/environment || echo 'CONTAINER_HOST=unix:///run/podman/podman.sock' >> /etc/environment
    grep -q '^DOCKER_HOST=' /etc/environment || echo 'DOCKER_HOST=unix:///run/podman/podman.sock' >> /etc/environment
    systemd-tmpfiles --create /usr/lib/tmpfiles.d/podman-docker.conf   # /run/docker.sock tout de suite
