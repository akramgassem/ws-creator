#cloud-config
# podman fragment: podman as root (Falcon prevents the user's systemd session, which rootless
# mode needs); the user drives it through the API socket, open to the podman group. What each
# machine decides is in machines/<name>/user-data.yaml: membership of the podman group (socket
# access = root rights) and subnet (containers.conf.d/60-ws-creator-machine.conf).
merge_how: 'dict(recurse_array,no_replace)+list(append)'

# system group, before the user is created (bootcmd runs before users_groups): with the groups
# key, cloud-init would create it as gid 1000 and the user would get gid 1001
bootcmd:
  - [sh, -c, 'getent group podman >/dev/null || groupadd --system podman']

# podman-docker: docker command redirected to podman + /run/docker.sock link
packages: [podman, podman-docker]

write_files:
  # without this file, docker (podman-docker) prints a warning on every call
  - path: /etc/containers/nodocker
    content: ""
  # short image names
  - path: /etc/containers/registries.conf.d/50-ws-creator.conf
    content: |
      unqualified-search-registries = ["docker.io"]
  # Falcon delegates no cgroup controller under sensor.falcon: the default pids limit (2048)
  # needs the pids controller, so it is removed. --memory/--cpus will fail.
  - path: /etc/containers/containers.conf.d/50-ws-creator.conf
    content: |
      [containers]
      pids_limit = 0
  - path: /etc/systemd/system/podman.socket.d/50-ws-creator.conf
    content: |
      [Socket]
      SocketGroup=podman
      SocketMode=0660
  # WSL sets XDG_RUNTIME_DIR even when the user session fails (Falcon)
  - path: /etc/profile.d/ws-creator-podman.sh
    content: |
      [ -d "${XDG_RUNTIME_DIR:-}" ] || unset XDG_RUNTIME_DIR

runcmd:
  - |
    set -e
    # the package creates /run/podman as 700 root (tmpfiles): open it to the group as well
    sed 's|^D! /run/podman 0700 root root|D! /run/podman 0750 root podman|' \
        /usr/lib/tmpfiles.d/podman.conf > /etc/tmpfiles.d/podman.conf
    mkdir -p /run/podman
    chgrp podman /run/podman
    chmod 0750 /run/podman
    systemctl daemon-reload
    systemctl enable podman.socket
    systemctl restart podman.socket
    # the user's podman command goes through this socket, in every session:
    # /etc/environment is read by PAM (ssh, VS Code), even without a login shell; same socket
    # for tools that speak "Docker" (compose, Testcontainers...)
    grep -q '^CONTAINER_HOST=' /etc/environment || echo 'CONTAINER_HOST=unix:///run/podman/podman.sock' >> /etc/environment
    grep -q '^DOCKER_HOST=' /etc/environment || echo 'DOCKER_HOST=unix:///run/podman/podman.sock' >> /etc/environment
    systemd-tmpfiles --create /usr/lib/tmpfiles.d/podman-docker.conf   # /run/docker.sock right away
