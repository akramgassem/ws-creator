#cloud-config
# guard fragment: guardrails for everything that goes through git, human or agent.
# The files come from files/ (usr/local/bin/machine-*, usr/local/lib/ws-creator/git-hooks/);
# the /tidy skill (usr/local/share/ws-creator/claude/skills/) is put in ~/.claude by the agent module;
# the machine's settings (etc/ws-creator/guard.conf, etc/ws-creator/denylist.sha256) come from
# machines/<name>/files/. Here: permissions, machine-wide hooks, system git config.
merge_how: 'dict(recurse_array,no_replace)+list(append)'

runcmd:
  - |
    set -e
    lib=/usr/local/lib/ws-creator/git-hooks
    hooks=/etc/ws-creator/hooks
    chmod 755 /usr/local/bin/machine-state /usr/local/bin/machine-leftovers /usr/local/bin/machine-crumbs \
        /usr/local/bin/machine-prune-branch "$lib"/*
    # Every hook goes through dispatch, which chains to the repo's own. reference-transaction is
    # left out: called on every ref update, it would slow down all of git.
    rm -rf "$hooks"
    mkdir -p "$hooks"
    for h in applypatch-msg pre-applypatch post-applypatch pre-commit pre-merge-commit \
        prepare-commit-msg commit-msg post-commit pre-rebase post-checkout post-merge \
        pre-push post-rewrite pre-auto-gc push-to-checkout; do
        ln -s "$lib/dispatch" "$hooks/$h"
    done
    git config --system core.hooksPath "$hooks"
