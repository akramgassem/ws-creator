<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ws-creator architecture</title>
  <desc>On the Windows side, ws-creator reads machines\&lt;name&gt;\, assembles the cloud-config fragments into a NoCloud seed, copies files\ and runs the agent module in the WSL distro; tools connect to it through an SSH alias that goes through wsl.exe. In the distro, cloud-init applies the fragments; projects carry their own tools, services and hooks; personal config comes from dotfiles. All distros share the WSL network stack.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="920" height="640" fill="#ffffff"/>

  <!-- Windows -->
  <rect x="20" y="20" width="320" height="530" rx="14" fill="#EEF4FB" stroke="#378ADD"/>
  <text x="36" y="46" font-size="15" font-weight="600" fill="#0C447C">Windows (ws-creator + your machines)</text>

  <rect x="40" y="60" width="280" height="60" rx="8" fill="#fff" stroke="#85B7EB" stroke-dasharray="4 3"/>
  <text x="180" y="84" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">WS_CREATOR_MACHINES\&lt;name&gt;\  (who)</text>
  <text x="180" y="104" font-size="12" fill="#185FA5" text-anchor="middle">outside the module, private · from: ws-creator init</text>

  <rect x="40" y="134" width="280" height="60" rx="8" fill="#fff" stroke="#85B7EB"/>
  <text x="180" y="158" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">cloud-config\  ·  files\  ·  modules\</text>
  <text x="180" y="178" font-size="12" fill="#185FA5" text-anchor="middle">shared fragments · files as is · agent.sh</text>

  <rect x="40" y="222" width="280" height="60" rx="8" fill="#fff" stroke="#378ADD" stroke-width="1.5"/>
  <text x="180" y="246" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">ws-creator.ps1 → src\WsCreator</text>
  <text x="180" y="266" font-size="12" fill="#185FA5" text-anchor="middle">new · apply · purge · stop · status · code</text>

  <line x1="180" y1="196" x2="180" y2="218" stroke="#444441" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="190" y="211" font-size="11" fill="#5F5E5A">reads and checks</text>

  <rect x="40" y="340" width="280" height="54" rx="8" fill="#fff" stroke="#85B7EB"/>
  <text x="180" y="362" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">~\.ssh\ws-creator\&lt;name&gt;.conf</text>
  <text x="180" y="381" font-size="12" fill="#185FA5" text-anchor="middle">Host &lt;name&gt; · ProxyCommand wsl.exe nc</text>

  <line x1="180" y1="284" x2="180" y2="336" stroke="#444441" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="190" y="316" font-size="11" fill="#5F5E5A">writes (ssh fragment)</text>

  <rect x="40" y="460" width="280" height="54" rx="8" fill="#fff" stroke="#85B7EB"/>
  <text x="180" y="482" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">VS Code · Claude app · ssh</text>
  <text x="180" y="501" font-size="12" fill="#185FA5" text-anchor="middle">SSH host &lt;name&gt;</text>

  <line x1="180" y1="458" x2="180" y2="398" stroke="#444441" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="190" y="432" font-size="11" fill="#5F5E5A">reads</text>

  <!-- Distro -->
  <rect x="380" y="20" width="520" height="530" rx="14" fill="#F1F7EC" stroke="#639922"/>
  <text x="396" y="46" font-size="15" font-weight="600" fill="#27500A">WSL distro &lt;name&gt; — Ubuntu 24.04</text>

  <rect x="400" y="60" width="480" height="70" rx="8" fill="#fff" stroke="#97C459"/>
  <text x="640" y="83" font-size="13" font-weight="600" fill="#27500A" text-anchor="middle">seed NoCloud  /var/lib/cloud/seed/nocloud/</text>
  <text x="640" y="102" font-size="12" fill="#3B6D11" text-anchor="middle">user-data = make-mime(fragments, then user-data.yaml) · meta-data = instance-id</text>
  <text x="640" y="119" font-size="12" fill="#3B6D11" text-anchor="middle">cloud-init clean → restart → status --wait (adds, never removes)</text>

  <line x1="322" y1="228" x2="396" y2="96" stroke="#444441" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="335" y="150" font-size="11" fill="#5F5E5A" transform="rotate(-62 335 150)">seed + files\</text>

  <text x="400" y="156" font-size="12" font-weight="600" fill="#27500A">Fragments (cloud-init)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="400" y="164" width="72" height="30" rx="6" fill="#fff" stroke="#97C459"/><text x="436" y="184" fill="#27500A">base</text>
    <rect x="480" y="164" width="72" height="30" rx="6" fill="#fff" stroke="#97C459"/><text x="516" y="184" fill="#27500A">mise</text>
    <rect x="560" y="164" width="72" height="30" rx="6" fill="#fff" stroke="#97C459"/><text x="596" y="184" fill="#27500A">guard</text>
    <rect x="640" y="164" width="72" height="30" rx="6" fill="#fff" stroke="#97C459"/><text x="676" y="184" fill="#27500A">podman</text>
    <rect x="720" y="164" width="72" height="30" rx="6" fill="#fff" stroke="#97C459"/><text x="756" y="184" fill="#27500A">ssh</text>
    <rect x="800" y="164" width="80" height="30" rx="6" fill="#fff" stroke="#639922" stroke-dasharray="4 3"/><text x="840" y="184" fill="#27500A">user-data</text>
  </g>

  <rect x="400" y="208" width="480" height="30" rx="6" fill="#fff" stroke="#97C459"/>
  <text x="640" y="228" font-size="12" fill="#27500A" text-anchor="middle">agent module (script, after cloud-init): ~/.claude/CLAUDE.md, SessionStart hook</text>

  <line x1="322" y1="250" x2="396" y2="226" stroke="#444441" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="324" y="272" font-size="10" fill="#5F5E5A">WS_CREATOR_*</text>

  <g font-size="12">
    <rect x="400" y="256" width="236" height="62" rx="8" fill="#fff" stroke="#97C459"/>
    <text x="518" y="278" font-weight="600" fill="#27500A" text-anchor="middle">Shared tools (mise)</text>
    <text x="518" y="297" fill="#3B6D11" text-anchor="middle">~/.config/mise/config.toml</text>
    <text x="518" y="312" fill="#3B6D11" text-anchor="middle">chezmoi · gh · node · python…</text>

    <rect x="644" y="256" width="236" height="62" rx="8" fill="#fff" stroke="#97C459"/>
    <text x="762" y="278" font-weight="600" fill="#27500A" text-anchor="middle">Guardrails (git)</text>
    <text x="762" y="297" fill="#3B6D11" text-anchor="middle" font-size="11">/etc/ws-creator/hooks → dispatch → .git/hooks</text>
    <text x="762" y="312" fill="#3B6D11" text-anchor="middle">machine-state · machine-leftovers</text>

    <rect x="400" y="326" width="236" height="62" rx="8" fill="#fff" stroke="#97C459"/>
    <text x="518" y="348" font-weight="600" fill="#27500A" text-anchor="middle">podman as root</text>
    <text x="518" y="367" fill="#3B6D11" text-anchor="middle">/run/podman/podman.sock (group)</text>
    <text x="518" y="382" fill="#3B6D11" text-anchor="middle">DOCKER_HOST · unique subnet</text>

    <rect x="644" y="326" width="236" height="62" rx="8" fill="#fff" stroke="#97C459"/>
    <text x="762" y="348" font-weight="600" fill="#27500A" text-anchor="middle">sshd 127.0.0.1:&lt;port&gt;</text>
    <text x="762" y="367" fill="#3B6D11" text-anchor="middle">key only · AllowUsers</text>
    <text x="762" y="382" fill="#3B6D11" text-anchor="middle">host keys kept on rerun</text>
  </g>

  <path d="M322 380 L370 380 L370 399 L762 399 L762 393" fill="none" stroke="#444441" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="230" y="412" font-size="11" fill="#5F5E5A">ssh: wsl.exe + nc</text>

  <!-- In the projects -->
  <rect x="400" y="410" width="480" height="122" rx="8" fill="#FBF6EC" stroke="#BA7517"/>
  <text x="416" y="432" font-size="13" font-weight="600" fill="#633806">~/src: what belongs to the project or the user</text>
  <g font-size="12" fill="#854F0B">
    <text x="416" y="454">mise.toml: versions and tasks (mise run build)</text>
    <text x="416" y="472">compose.yaml: services, network_mode: host</text>
    <text x="416" y="490">lefthook.yml · AGENTS.md · .devcontainer/ · CI GitHub Actions</text>
    <text x="416" y="514">dotfiles (chezmoi): git identity — gh auth login, then chezmoi init --apply</text>
  </g>

  <!-- Shared network -->
  <rect x="20" y="566" width="880" height="56" rx="10" fill="#F6F5F2" stroke="#B4B2A9"/>
  <text x="460" y="589" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">Shared WSL network stack (mirrored): 127.0.0.1 and ports common to Windows and all distros</text>
  <text x="460" y="608" font-size="12" fill="#5F5E5A" text-anchor="middle">hence: Ssh.Port and PodmanSubnet unique per machine (checked by ws-creator) · stop with ws-creator stop</text>
</svg>
